spring.application.name=LeTaskManager

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=tts_TaskManager;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

jwt.secret=MySecretKeyForTaskManagerApplicationMinimum256Bits
jwt.expiration=86400000